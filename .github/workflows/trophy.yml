name: Generate GitHub Trophies

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-trophies:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Checkout GitHub Profile Trophy generator
        uses: actions/checkout@v4
        with:
          repository: ryo-ma/github-profile-trophy
          path: trophy-generator

      - name: Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v1.x

      - name: Generate trophy SVG
        env:
          GITHUB_TOKEN1: ${{ secrets.GITHUB_TOKEN }}
        run: |
          deno run \
            --allow-net \
            --allow-env \
            --allow-read \
            --allow-write \
            trophy-generator/render_svg.ts \
            Sappymukherjee214 \
            trophy.svg \
            discord

      - name: Commit updated trophy
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add trophy.svg

          if git diff --cached --quiet; then
            echo "No trophy changes."
          else
            git commit -m "chore: update GitHub trophies"
            git push
          fi
