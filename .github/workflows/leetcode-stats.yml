name: Update LeetCode Stats

on:
  # Run every 6 hours to check for updates
  schedule:
    - cron: "0 */6 * * *"

  # Allow manual trigger
  workflow_dispatch:

  # Run when pushing to main
  push:
    branches:
      - main

jobs:
  update-stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Refresh LeetCode Stats Cache
        run: |
          echo "Refreshing LeetCode stats for profile: AI5z0AfjZM"
          echo "Stats are automatically fetched from LeetCode API"
          echo "This workflow runs every 6 hours to ensure fresh data"

          # Fetch the badge to refresh cache
          curl -s "https://leetcard.jacoblin.cool/AI5z0AfjZM?theme=dark&font=Josefin%20Slab&ext=heatmap" > /dev/null

          echo "✅ LeetCode stats cache refreshed successfully!"
