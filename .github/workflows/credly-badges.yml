name: Update Credly Badges

on:
  # Run daily to check for new badges
  schedule:
    - cron: "0 8 * * *"

  # Allow manual trigger
  workflow_dispatch:

  # Run on push to main
  push:
    branches:
      - main

jobs:
  update-badges:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Fetch Credly Badges
        run: |
          echo "Fetching badges from Credly profile..."

          # Fetch the Credly profile page
          PROFILE_URL="https://www.credly.com/users/saptarshi-mukherjee.62a3f023"

          # Create badges section
          echo "" > credly_badges.md
          echo "## 🏅 Credly Badges" >> credly_badges.md
          echo "" >> credly_badges.md
          echo "<div align=\"center\">" >> credly_badges.md
          echo "" >> credly_badges.md
          echo "[![Credly Profile](https://img.shields.io/badge/Credly-Profile-orange?style=for-the-badge&logo=credly&logoColor=white)](${PROFILE_URL})" >> credly_badges.md
          echo "" >> credly_badges.md

          # Fetch badges using curl and parse (simplified version)
          curl -s "$PROFILE_URL" > profile.html

          # Extract badge images (this is a basic extraction)
          grep -oP 'https://images.credly.com/size/[^"]+' profile.html | head -20 | while read badge_url; do
            echo "[![Badge](${badge_url})](${PROFILE_URL})" >> credly_badges.md
          done

          echo "" >> credly_badges.md
          echo "</div>" >> credly_badges.md

          rm -f profile.html

          echo "✅ Credly badges fetched successfully!"

      - name: Update README with Badges
        run: |
          # Find the Credly section markers and replace content
          if grep -q "<!--START_SECTION:credly-->" README.md; then
            # Replace content between markers
            sed -i '/<!--START_SECTION:credly-->/,/<!--END_SECTION:credly-->/!b; /<!--START_SECTION:credly-->/!d; r credly_badges.md' README.md
            echo "✅ README updated with Credly badges"
          else
            echo "⚠️ Credly section markers not found in README"
          fi

          rm -f credly_badges.md

      - name: Commit Changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add README.md
          git diff --quiet && git diff --staged --quiet || git commit -m "Update Credly badges [skip ci]"

      - name: Push Changes
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.ref }}
